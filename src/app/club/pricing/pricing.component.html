<div class="container mx-auto px-4">
  <h2 class="text-3xl font-bold text-center mb-12">Nos tarifs</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <div
      *ngFor="let plan of plans"
      class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col h-full"
    >
      <div class="p-6 flex flex-col flex-grow">
        <div class="flex-grow">
          <h3 class="text-xl font-bold mb-2">{{ plan.title }}</h3>
          <p *ngIf="plan.audience" class="text-gray-600 font-medium mb-2">
            {{ plan.audience }}
          </p>
          <p class="text-gray-700 mb-4">{{ plan.description }}</p>
          <div class="space-y-1">
            <p
              *ngFor="let line of plan.priceLines"
              class="font-semibold text-[#f84c00]"
            >
              {{ line }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
