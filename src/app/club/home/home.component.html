<main class="pt-[68px]">
  <!-- Push Section -->
  <!-- Presentation Section -->
  <section
    id="presentation"
    class="relative min-h-screen flex flex-col items-center gap-12 px-8 py-24 overflow-hidden"
  >
    <video
      *ngIf="showVideo; else heroFallback"
      autoplay
      muted
      loop
      playsinline
      [style.opacity]="0.8"
      class="absolute top-0 left-0 w-full h-full object-cover -z-10"
    >
      <source
        [src]="club.videoUrl"
        type="video/mp4"
        (error)="videoFailed = true"
      />
    </video>

    <ng-template #heroFallback>
      <div
        class="absolute top-0 left-0 w-full h-full bg-cover bg-center -z-10"
        [style.background-image]="'url(' + heroImage + ')'"
      ></div>
    </ng-template>

    <div
      class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-black/60 via-black/80 to-black -z-10"
    ></div>

    <div class="text-center text-white max-w-3xl mb-12">
      <h2 class="text-4xl md:text-5xl font-bold mb-4">{{ club.heroTitle }}</h2>
      <p class="text-xl md:text-2xl">{{ club.heroSubtitle }}</p>
    </div>

    <div class="w-full max-w-5xl flex justify-start">
      <div class="bg-gray-200 p-6 rounded-lg shadow-lg w-full md:w-[70%]">
        <h3 class="text-2xl font-semibold mb-3">Le club</h3>
        <p>{{ club.presentation }}</p>
      </div>
    </div>

    <div class="w-full max-w-5xl flex justify-end">
      <div
        class="bg-gray-200 p-6 rounded-lg shadow-lg w-full md:w-[70%] text-right"
      >
        <h3 class="text-2xl font-semibold mb-3">Horaires</h3>
        <p *ngFor="let slot of club.openingHours">
          {{ slot.days }} : {{ slot.hours }}
        </p>
      </div>
    </div>

    <div class="w-full max-w-5xl flex justify-start">
      <div class="bg-gray-200 p-6 rounded-lg shadow-lg w-full md:w-[70%]">
        <h3 class="text-2xl font-semibold mb-3">Pourquoi nous rejoindre ?</h3>
        <p>{{ club.whyJoin }}</p>
      </div>
    </div>
  </section>

  <section id="price" class="py-16 md:py-24 px-8 bg-gray-200">
    <app-pricing [plans]="club.pricing"></app-pricing>
  </section>

  <section id="event" class="py-16 md:py-24 px-8 bg-gray-900 text-white">
    <app-event [events]="club.events"></app-event>
  </section>

  <section id="faq" class="py-16 md:py-24 px-8 bg-gray-200">
    <app-faq [items]="club.faq"></app-faq>
  </section>

  <section id="instafeed" class="py-16 md:py-24 px-8 bg-gray-900">
    <app-instagram-feed [handle]="club.contact.instagram"></app-instagram-feed>
  </section>

  <section id="contact" class="py-16 md:py-24 px-8 bg-gray-200">
    <app-contact [club]="club"></app-contact>
  </section>
</main>

<!-- Back to Top Button -->
<button
  *ngIf="showBackToTop"
  (click)="scrollToTop()"
  class="fixed bottom-8 right-8 bg-[#f84c00] text-white p-4 rounded-full shadow-lg hover:bg-[#d94400] transition-colors cursor-pointer"
  aria-label="Back to top"
>
  ↑
</button>
